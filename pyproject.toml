[project]
name = "aurscan"
version = "0.1.0"
description = "Static risk scanner for AUR packages"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "tree-sitter>=0.25",
    "tree-sitter-bash>=0.25",
]

[project.scripts]
aurscan = "aurscan.cli:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/aurscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF100"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
