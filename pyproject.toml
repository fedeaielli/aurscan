[project]
name = "aurscan"
version = "0.1.0"
description = "Static risk scanner for AUR packages"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "faielli" }]
keywords = ["aur", "archlinux", "pkgbuild", "security", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "tree-sitter>=0.25",
    "tree-sitter-bash>=0.25",
]

[project.scripts]
aurscan = "aurscan.cli:run"

[project.urls]
Homepage = "https://github.com/faielli/aurscan"
Repository = "https://github.com/faielli/aurscan"
Issues = "https://github.com/faielli/aurscan/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/aurscan"]

[tool.hatch.build.targets.wheel.force-include]
"config/scoring.yml" = "aurscan/config/scoring.yml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=src/aurscan --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF100"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
